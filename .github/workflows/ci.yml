name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-runs CI and redeploys the head of main (e.g. after DEPLOY_ENABLED is switched on).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (a new push cancels the superseded run) and one per commit on main, so
  # every merged commit gets its own result.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Protos match the pinned vertice-api commit
        # vertice-api is public: no token needed. Fails when protos/vertice differs from protos/.api-ref.
        run: npm run sync:protos -- --check
      - name: docs/openapi.json and the route reference are up to date
        # Generated from the route schemas. Fails when a route or schema changed without `npm run openapi`.
        run: npm run openapi -- --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: The suite passes under a hostile host time zone
        # The business zone is America/Sao_Paulo and nothing may depend on the host's TZ (P2-02).
        # Pacific/Kiritimati is UTC+14, across the date line from it, so any dependence that slipped
        # in shows up as a wrong day. vertice-api's `hostileTimeZoneTest` does the same for the JVM.
        run: npm run test:hostile-tz
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ---- Continuous deployment (see the README's "Continuous deployment") ----
  # Only main, only after every CI job above passed on this same commit, only while the
  # repository variable DEPLOY_ENABLED is 'true' (unset it to freeze deploys), and only the newest
  # commit on main: CI runs once per commit, so an older commit whose CI finishes last must not
  # overwrite a newer deploy.
  deploy-gate:
    needs: [build-and-test]
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Is this commit still the head of main?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved on to ${head}; skipping the deploy of ${GITHUB_SHA} (the newer commit deploys itself)."
          fi

  deploy:
    needs: deploy-gate
    if: needs.deploy-gate.outputs.current == 'true'
    # Native arm64 runner (free on public repos): the Fargate tasks are Graviton/ARM64, and
    # building under QEMU emulation would be several times slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> the vertice-bff-deploy IAM role; no stored AWS keys
    # One deploy of this service at a time; a newer one queues instead of cancelling a rollout.
    concurrency:
      group: deploy-vertice-bff
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: vertice-bff
      ECS_CLUSTER: vertice
      ECS_SERVICE: vertice-bff
      CONTAINER_NAME: vertice-bff
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Image tag (12-character commit SHA)
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::096571798756:role/vertice-bff-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable in ECR, so a re-run (or a workflow_dispatch redeploy of the same
      # commit) reuses the image already pushed instead of failing on the push.
      - name: Check whether this commit's image is already in ECR
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if out="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Dockerfile.prod (linux/arm64)
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          # Plain image manifest (no attestation index), so ECR scan-on-push reports on it.
          provenance: false
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,scope=deploy-arm64,mode=max

      - name: Render the task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: .aws/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # Registers a new revision of the task family, points the service at it and waits until
      # the rollout completes. If the new tasks never get healthy, the service's deployment
      # circuit breaker rolls back to the previous revision and this step fails.
      - name: Deploy to ECS and wait for the rollout
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10
          wait-max-delay-seconds: 15
          # The action drops empty values by default; keep empty env values: CORS_ORIGIN="" deliberately
          # overrides the localhost default (no browser client calls the deployed BFF cross-origin).
          keep-null-value-keys: value
