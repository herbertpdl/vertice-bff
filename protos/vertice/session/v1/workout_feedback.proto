syntax = "proto3";

package vertice.session.v1;

option java_package = "com.vertice.api.generated.grpc.session.v1";
option java_multiple_files = true;

service WorkoutFeedbackService {
  // Authorization (P1-01, matrix in vertice-api CLAUDE.md): needs a user token.

  // The log's client or ADMIN; anyone else, or a missing log, is PERMISSION_DENIED.
  rpc SubmitWorkoutFeedback(SubmitWorkoutFeedbackRequest) returns (WorkoutFeedbackResponse);
  // TRAINER with their own trainer_id (anything else is PERMISSION_DENIED), or ADMIN.
  rpc ListWorkoutFeedback(ListWorkoutFeedbackRequest) returns (ListWorkoutFeedbackResponse);
}

message WorkoutFeedbackResponse {
  int64 id = 1;
  int64 workout_log_id = 2;
  int64 workout_id = 3;
  int64 training_plan_id = 4;
  int64 client_id = 5;
  string text = 6;
  string created_at = 7;
}

message SubmitWorkoutFeedbackRequest {
  int64 workout_log_id = 1;
  string text = 2;
}

message ListWorkoutFeedbackRequest {
  int64 trainer_id = 1;
}

message ListWorkoutFeedbackResponse {
  repeated WorkoutFeedbackResponse workout_feedback = 1;
}
