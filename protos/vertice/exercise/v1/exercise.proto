syntax = "proto3";

package vertice.exercise.v1;

import "google/protobuf/empty.proto";

option java_package = "com.vertice.api.generated.grpc.exercise.v1";
option java_multiple_files = true;

service ExerciseService {
  // The 14 launch muscle groups in catalog order. Needs no caller identity.
  rpc ListMuscleGroups(ListMuscleGroupsRequest) returns (ListMuscleGroupsResponse);
  // One page of the caller's own exercises plus the shared starter set, optionally filtered and
  // searched.
  rpc ListExercises(ListExercisesRequest) returns (ListExercisesResponse);
  rpc GetExercise(GetExerciseRequest) returns (ExerciseResponse);
  rpc CreateExercise(ExerciseRequest) returns (ExerciseResponse);
  rpc UpdateExercise(UpdateExerciseRequest) returns (ExerciseResponse);
  rpc DeleteExercise(DeleteExerciseRequest) returns (google.protobuf.Empty);
}

message MuscleGroupResponse {
  int64 id = 1;
  string name = 2;
}

message ListMuscleGroupsRequest {
}

message ListMuscleGroupsResponse {
  repeated MuscleGroupResponse muscle_groups = 1;
}

message ExerciseResponse {
  // Was the single MuscleGroup enum, replaced by muscle_groups.
  reserved 5;
  reserved "muscle_group";
  int64 id = 1;
  string name = 2;
  string description = 3;
  string video_url = 4;
  // Primary group first (starter exercises only), then the rest by id. Trainer-created exercises
  // have no primary group, so theirs come out in id order.
  repeated MuscleGroupResponse muscle_groups = 6;
  // True for the shared starter set, which cannot be changed or deleted.
  bool is_starter = 7;
}

message ExerciseRequest {
  // Was the single MuscleGroup enum, replaced by muscle_group_ids.
  reserved 4;
  reserved "muscle_group";
  string name = 1;
  string description = 2;
  string video_url = 3;
  // At least one; duplicates are collapsed. None becomes a primary group.
  repeated int64 muscle_group_ids = 5;
}

message ListExercisesRequest {
  // 0 = no filter.
  int64 muscle_group_id = 1;
  // Case-insensitive substring of the name; empty = no filter; at most 100 characters.
  string search = 2;
  // Exercises per page. 0 means the default (30); anything above the maximum (50) is lowered to
  // it; a negative value is INVALID_ARGUMENT.
  int32 page_size = 3;
  // next_page_token from the previous page, sent with the same filter and search; empty for the
  // first page. Opaque: pass it back as is. A malformed token is INVALID_ARGUMENT.
  string page_token = 4;
}

message ListExercisesResponse {
  repeated ExerciseResponse exercises = 1;
  // Pass as page_token to get the next page. Empty on the last page.
  string next_page_token = 2;
}

message GetExerciseRequest {
  int64 id = 1;
}

message UpdateExerciseRequest {
  int64 id = 1;
  ExerciseRequest exercise = 2;
}

message DeleteExerciseRequest {
  int64 id = 1;
}
