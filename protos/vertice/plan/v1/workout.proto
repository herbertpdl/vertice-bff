syntax = "proto3";

package vertice.plan.v1;

import "google/protobuf/empty.proto";
import "vertice/plan/v1/exercise_set.proto";

option java_package = "com.vertice.api.generated.grpc.plan.v1";
option java_multiple_files = true;

service WorkoutService {
  // Authorization (P1-01, matrix in vertice-api CLAUDE.md): needs a user token. The plan's trainer
  // reads and writes it and everything under it, its client only reads, ADMIN bypasses. To anyone
  // else a missing id and someone else's id are the same PERMISSION_DENIED; ADMIN gets NOT_FOUND.

  // The plan's trainer or client, ADMIN.
  rpc ListWorkouts(ListWorkoutsRequest) returns (ListWorkoutsResponse);
  // The plan's trainer or client, ADMIN.
  rpc GetWorkout(GetWorkoutRequest) returns (WorkoutResponse);
  // The plan's trainer or ADMIN.
  rpc CreateWorkout(WorkoutCreateRequest) returns (WorkoutResponse);
  // The plan's trainer or ADMIN.
  rpc UpdateWorkout(UpdateWorkoutRequest) returns (WorkoutResponse);
  // The plan's trainer or ADMIN.
  rpc DeleteWorkout(DeleteWorkoutRequest) returns (google.protobuf.Empty);
  // The trainer of both the source workout's plan and the target plan, or ADMIN. Every exercise
  // must be visible to the target plan's trainer.
  rpc CloneWorkout(CloneWorkoutRequest) returns (WorkoutResponse);
  // The plan's trainer or ADMIN. Every exercise must be visible to the plan's trainer (starter set
  // or their own), else PERMISSION_DENIED naming the lowest offending id.
  rpc CreateWorkoutWithExercises(CreateWorkoutWithExercisesRequest) returns (WorkoutResponse);
  // As CreateWorkoutWithExercises, checked before the recorded-data refusal.
  rpc ReplaceWorkoutExercises(ReplaceWorkoutExercisesRequest) returns (WorkoutResponse);
}

enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  MONDAY = 1;
  TUESDAY = 2;
  WEDNESDAY = 3;
  THURSDAY = 4;
  FRIDAY = 5;
  SATURDAY = 6;
  SUNDAY = 7;
}

message WorkoutResponse {
  int64 id = 1;
  string name = 2;
  int64 training_plan_id = 3;
  DayOfWeek day_of_week = 4;
}

message WorkoutRequest {
  string name = 1;
  DayOfWeek day_of_week = 2;
}

message WorkoutCreateRequest {
  string name = 1;
  int64 training_plan_id = 2;
  DayOfWeek day_of_week = 3;
}

message ListWorkoutsRequest {
  int64 training_plan_id = 1;
}

message ListWorkoutsResponse {
  repeated WorkoutResponse workouts = 1;
}

message GetWorkoutRequest {
  int64 id = 1;
}

message UpdateWorkoutRequest {
  int64 id = 1;
  WorkoutRequest workout = 2;
}

message DeleteWorkoutRequest {
  int64 id = 1;
}

message CloneWorkoutRequest {
  int64 source_workout_id = 1;
  int64 target_training_plan_id = 2;
  string name = 3;
  DayOfWeek day_of_week = 4;
}

message CreateWorkoutWithExercisesRequest {
  string name = 1;
  int64 training_plan_id = 2;
  DayOfWeek day_of_week = 3;
  repeated WorkoutExerciseEntry exercises = 4;
}

message ReplaceWorkoutExercisesRequest {
  int64 workout_id = 1;
  repeated WorkoutExerciseEntry exercises = 2;
}

message WorkoutExerciseEntry {
  int64 exercise_id = 1;
  int32 rest_seconds_between_sets = 2;
  string notes = 3;
  repeated ExerciseSetEntry sets = 4;
}

message ExerciseSetEntry {
  int32 reps = 1;
  int32 duration_seconds = 2;
  string weight = 3;
  string load_percentage = 4;
  SetStrategy strategy = 5;
  int32 rest_seconds = 6;
  string notes = 7;
}
