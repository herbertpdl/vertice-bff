syntax = "proto3";

package vertice.plan.v1;

import "google/protobuf/empty.proto";

option java_package = "com.vertice.api.generated.grpc.plan.v1";
option java_multiple_files = true;

service WorkoutExerciseService {
  // Authorization (P1-01, matrix in vertice-api CLAUDE.md): needs a user token. The plan's trainer
  // reads and writes it and everything under it, its client only reads, ADMIN bypasses. To anyone
  // else a missing id and someone else's id are the same PERMISSION_DENIED; ADMIN gets NOT_FOUND.

  // The plan's trainer or client, ADMIN.
  rpc ListWorkoutExercises(ListWorkoutExercisesRequest) returns (ListWorkoutExercisesResponse);
  // The plan's trainer or client, ADMIN.
  rpc GetWorkoutExercise(GetWorkoutExerciseRequest) returns (WorkoutExerciseResponse);
  // The plan's trainer or ADMIN. The exercise must be visible to the plan's trainer (starter set
  // or their own): a missing one is NOT_FOUND, another trainer's PERMISSION_DENIED.
  rpc CreateWorkoutExercise(WorkoutExerciseCreateRequest) returns (WorkoutExerciseResponse);
  // The plan's trainer or ADMIN.
  rpc UpdateWorkoutExercise(UpdateWorkoutExerciseRequest) returns (WorkoutExerciseResponse);
  // The plan's trainer or ADMIN.
  rpc DeleteWorkoutExercise(DeleteWorkoutExerciseRequest) returns (google.protobuf.Empty);
}

message WorkoutExerciseResponse {
  int64 id = 1;
  int64 workout_id = 2;
  int64 exercise_id = 3;
  int32 order = 4;
  int32 rest_seconds_between_sets = 5;
  string notes = 6;
}

message WorkoutExerciseRequest {
  int32 order = 1;
  int32 rest_seconds_between_sets = 2;
  string notes = 3;
}

message WorkoutExerciseCreateRequest {
  int64 workout_id = 1;
  int64 exercise_id = 2;
  int32 order = 3;
  int32 rest_seconds_between_sets = 4;
  string notes = 5;
}

message ListWorkoutExercisesRequest {
  int64 workout_id = 1;
}

message ListWorkoutExercisesResponse {
  repeated WorkoutExerciseResponse workout_exercises = 1;
}

message GetWorkoutExerciseRequest {
  int64 id = 1;
}

message UpdateWorkoutExerciseRequest {
  int64 id = 1;
  WorkoutExerciseRequest workout_exercise = 2;
}

message DeleteWorkoutExerciseRequest {
  int64 id = 1;
}
