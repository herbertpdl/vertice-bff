syntax = "proto3";

package vertice.plan.v1;

import "google/protobuf/empty.proto";

option java_package = "com.vertice.api.generated.grpc.plan.v1";
option java_multiple_files = true;

service TrainingPlanService {
  rpc ListTrainingPlans(ListTrainingPlansRequest) returns (ListTrainingPlansResponse);
  rpc GetTrainingPlan(GetTrainingPlanRequest) returns (TrainingPlanResponse);
  rpc CreateTrainingPlan(TrainingPlanCreateRequest) returns (TrainingPlanResponse);
  rpc UpdateTrainingPlan(UpdateTrainingPlanRequest) returns (TrainingPlanResponse);
  rpc DeleteTrainingPlan(DeleteTrainingPlanRequest) returns (google.protobuf.Empty);
}

enum PlanLevel {
  PLAN_LEVEL_UNSPECIFIED = 0;
  BEGINNER = 1;
  INTERMEDIATE = 2;
  ADVANCED = 3;
}

message TrainingPlanResponse {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 trainer_id = 4;
  int64 client_id = 5;
  string start_date = 6;
  string end_date = 7;
  PlanLevel level = 8;
}

message TrainingPlanRequest {
  string name = 1;
  string description = 2;
  int64 client_id = 3;
  string start_date = 4;
  string end_date = 5;
  PlanLevel level = 6;
}

message TrainingPlanCreateRequest {
  string name = 1;
  string description = 2;
  int64 trainer_id = 3;
  int64 client_id = 4;
  string start_date = 5;
  string end_date = 6;
  PlanLevel level = 7;
}

message ListTrainingPlansRequest {
  int64 trainer_id = 1;
  int64 client_id = 2;
}

message ListTrainingPlansResponse {
  repeated TrainingPlanResponse training_plans = 1;
}

message GetTrainingPlanRequest {
  int64 id = 1;
}

message UpdateTrainingPlanRequest {
  int64 id = 1;
  TrainingPlanRequest training_plan = 2;
}

message DeleteTrainingPlanRequest {
  int64 id = 1;
}
