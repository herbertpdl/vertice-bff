syntax = "proto3";

package vertice.plan.v1;

import "google/protobuf/empty.proto";

option java_package = "com.vertice.api.generated.grpc.plan.v1";
option java_multiple_files = true;

service TrainingPlanService {
  // Authorization (P1-01, matrix in vertice-api CLAUDE.md): needs a user token. The plan's trainer
  // reads and writes it and everything under it, its client only reads, ADMIN bypasses. To anyone
  // else a missing id and someone else's id are the same PERMISSION_DENIED; ADMIN gets NOT_FOUND.

  // TRAINER: their own plans; CLIENT: the plans written for them; ADMIN: as filtered.
  rpc ListTrainingPlans(ListTrainingPlansRequest) returns (ListTrainingPlansResponse);
  // The plan's trainer or client, ADMIN.
  rpc GetTrainingPlan(GetTrainingPlanRequest) returns (TrainingPlanResponse);
  // TRAINER (as themself) or ADMIN; the client must be the trainer's active client.
  rpc CreateTrainingPlan(TrainingPlanCreateRequest) returns (TrainingPlanResponse);
  // The plan's trainer or ADMIN; the client can't change and must still be an active client.
  rpc UpdateTrainingPlan(UpdateTrainingPlanRequest) returns (TrainingPlanResponse);
  // The plan's trainer or ADMIN.
  rpc DeleteTrainingPlan(DeleteTrainingPlanRequest) returns (google.protobuf.Empty);
}

enum PlanLevel {
  PLAN_LEVEL_UNSPECIFIED = 0;
  BEGINNER = 1;
  INTERMEDIATE = 2;
  ADVANCED = 3;
}

message TrainingPlanResponse {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 trainer_id = 4;
  int64 client_id = 5;
  string start_date = 6;
  string end_date = 7;
  PlanLevel level = 8;
}

message TrainingPlanRequest {
  string name = 1;
  string description = 2;
  int64 client_id = 3;
  string start_date = 4;
  string end_date = 5;
  PlanLevel level = 6;
}

message TrainingPlanCreateRequest {
  string name = 1;
  string description = 2;
  // A TRAINER caller: 0 or their own id (anything else is PERMISSION_DENIED). ADMIN: the trainer.
  int64 trainer_id = 3;
  int64 client_id = 4;
  string start_date = 5;
  string end_date = 6;
  PlanLevel level = 7;
}

message ListTrainingPlansRequest {
  // 0 = no filter. A TRAINER caller is always scoped to themself: 0 or their own id, anything else
  // is PERMISSION_DENIED. Same for client_id and a CLIENT caller.
  int64 trainer_id = 1;
  int64 client_id = 2;
}

message ListTrainingPlansResponse {
  repeated TrainingPlanResponse training_plans = 1;
}

message GetTrainingPlanRequest {
  int64 id = 1;
}

message UpdateTrainingPlanRequest {
  int64 id = 1;
  TrainingPlanRequest training_plan = 2;
}

message DeleteTrainingPlanRequest {
  int64 id = 1;
}
