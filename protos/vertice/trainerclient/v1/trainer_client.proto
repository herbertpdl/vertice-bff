syntax = "proto3";

package vertice.trainerclient.v1;

import "google/protobuf/empty.proto";
import "vertice/user/v1/user.proto";

option java_package = "com.vertice.api.generated.grpc.trainerclient.v1";
option java_multiple_files = true;

service TrainerClientService {
  // TRAINER for their own trainer_id, or ADMIN (any trainer). Returns the new client in the detail
  // view: the caller is now their active trainer.
  rpc CreateClientForTrainer(CreateClientForTrainerRequest) returns (vertice.user.v1.UserResponse);
  // The trainer's active clients in the summary view (id, name, role): never email, cpf or cref
  // (P1-03).
  rpc ListClientsForTrainer(ListClientsForTrainerRequest) returns (ListClientsForTrainerResponse);
  rpc IsTrainersClient(IsTrainersClientRequest) returns (IsTrainersClientResponse);
  // Ends the trainer's active relationship with the client: sets ended_at, nothing else. The
  // client's account, the plans and every log stay as they are. TRAINER for their own trainer_id
  // (PERMISSION_DENIED when the client isn't on their active roster, the same answer for a
  // missing client), or ADMIN (NOT_FOUND when there is no active relationship). Afterwards the
  // trainer loses everything an active link grants (roster, detail view, progress, setup links,
  // new plans for the client, UpdateTrainingPlan) and keeps the plan-tree access of the plans
  // they wrote: the client keeps reading them too.
  rpc EndTrainerClientRelationship(EndTrainerClientRelationshipRequest) returns (google.protobuf.Empty);
  // A CLIENT's active trainer, with only the contacts the trainer chose to show (and filled in):
  // the client as themself, or ADMIN. NOT_FOUND when the client has no active trainer.
  rpc GetClientTrainer(GetClientTrainerRequest) returns (ClientTrainerResponse);
}

message GetClientTrainerRequest {
  int64 client_id = 1;
}

message ClientTrainerResponse {
  int64 trainer_id = 1;
  string name = 2;
  // Empty unless the trainer shows it.
  string email = 3;
  string whatsapp = 4;
  string instagram = 5;
}

message CreateClientForTrainerRequest {
  int64 trainer_id = 1;
  string name = 2;
  string email = 3;
  // Optional. Empty creates the client without a password; they set one with a password setup
  // token (UserService.CreatePasswordSetupToken).
  string password = 4;
  // Optional (P1-04): empty creates the client without a CPF. Validated when set.
  string cpf = 5;
}

message ListClientsForTrainerRequest {
  int64 trainer_id = 1;
}

message ListClientsForTrainerResponse {
  repeated vertice.user.v1.UserResponse clients = 1;
}

message IsTrainersClientRequest {
  int64 trainer_id = 1;
  int64 client_id = 2;
}

message IsTrainersClientResponse {
  bool is_client = 1;
}

message EndTrainerClientRelationshipRequest {
  int64 trainer_id = 1;
  int64 client_id = 2;
}
