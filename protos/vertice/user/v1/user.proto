syntax = "proto3";

package vertice.user.v1;

import "google/protobuf/empty.proto";

option java_package = "com.vertice.api.generated.grpc.user.v1";
option java_multiple_files = true;

service UserService {
  // Every RPC authorizes the caller from its token (P1-01); a refused caller gets PERMISSION_DENIED.
  // The full subject -> RPC matrix is in vertice-api's CLAUDE.md.

  // Every RPC returns UserResponse in one of four views (P1-03): self (every field, consent
  // included), detail (every field but consent), contact (id, name, role, email) or summary (id,
  // name, role). Fields outside the view are empty.

  // ADMIN or service:ops (anonymous only under the local profile). Contact view: the ops script
  // hands each setup link to its client by email, and the local dev login matches users by email.
  // Paginated, ordered by id: see ListUsersRequest. Deleted accounts (DeleteAccount) are left out,
  // and every other RPC here answers NOT_FOUND for one.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Self view for the user themself (the consent state drives the first-access notice). Detail for
  // ADMIN or the target's active trainer. A trainer with any training plan for the target (e.g. a
  // former client) gets the summary view.
  rpc GetUser(GetUserRequest) returns (UserResponse);
  // service:bff only (registration), and never with role ADMIN. Contact view. An email on the
  // reserved .invalid TLD is INVALID_ARGUMENT (also for UpdateUser and CreateClientForTrainer).
  rpc CreateUser(UserCreateRequest) returns (UserResponse);
  // Records a consent given by the calling user themself (P1-04): the Terms version they accepted,
  // or their consent to the processing of health-related data (loads, session logs, feedback; LGPD
  // art. 11, I). Stamped with the server's time; a later call replaces the earlier record. A user
  // token only: nobody, ADMIN included, can consent on someone else's behalf, and a service gets
  // PERMISSION_DENIED. Returns the caller's consent state after the change.
  rpc RecordConsent(RecordConsentRequest) returns (ConsentState);
  // ADMIN; or the user themself / the target's active trainer, without changing the role. Detail view.
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  // The user themself or ADMIN. FAILED_PRECONDITION while the user has training data (plans, logs,
  // clients, exercises): removing such an account is DeleteAccount.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
  // Deletes the calling user's own account (P1-05, LGPD art. 18 VI), in one transaction. The request
  // has no id: the token says whose account it is; a service gets PERMISSION_DENIED. Their workout
  // feedback, set logs and workout logs are deleted, and so are the plans written for them, their
  // unused private exercises and their password setup links. Every relationship of theirs ends. The
  // user row is kept, anonymised (name "Usuário removido"; email, CPF, CREF, password and
  // consent cleared), so plans they wrote for others still resolve; their tokens stop working on the next
  // call (UNAUTHENTICATED). A TRAINER with active clients gets FAILED_PRECONDITION: end those
  // relationships first (EndTrainerClientRelationship).
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty);
  // Everything vertice-api stores about the calling user (P1-05, LGPD art. 18 II and V), as one
  // JSON document: profile, consent, relationships, plans as their client or trainer (whole tree),
  // their own workout logs with set logs and feedback, and their private exercises. Credentials
  // (password hash, setup links) are never included. Self only: the request has no id, and a
  // service gets PERMISSION_DENIED. RESOURCE_EXHAUSTED when the account exceeds the export bounds
  // (vertice.export.*) rather than a truncated document. A deleted account can't call it (its
  // tokens are UNAUTHENTICATED).
  rpc ExportUserData(ExportUserDataRequest) returns (ExportUserDataResponse);
  // The user themself or ADMIN.
  rpc SetUserPassword(SetUserPasswordRequest) returns (google.protobuf.Empty);

  // The RPCs below back login and first-access password links.

  // Checks an email/password pair and returns the user it belongs to. The email is matched
  // case-insensitively. A wrong password, an unknown email and a user with no password set all fail
  // the same way: UNAUTHENTICATED "Invalid email or password".
  // service:bff, or a user checking their own email (re-check before a password change). Contact view.
  rpc VerifyCredentials(VerifyCredentialsRequest) returns (UserResponse);
  // Issues a single-use token that lets the user set their own password (first access). Issuing a
  // new token invalidates the user's previous unused ones. NOT_FOUND when the user doesn't exist.
  // service:ops, ADMIN, or a TRAINER for their active client who has no password yet.
  rpc CreatePasswordSetupToken(CreatePasswordSetupTokenRequest) returns (CreatePasswordSetupTokenResponse);
  // Sets the password of the token's user and consumes the token. An unknown, expired or already
  // used token fails the same way: UNAUTHENTICATED "Invalid or expired password setup token".
  // service:bff only.
  rpc SetPasswordWithToken(SetPasswordWithTokenRequest) returns (google.protobuf.Empty);
  // Users who have no password yet (e.g. clients created by a trainer), optionally filtered by role,
  // so a setup token can be issued to each of them. ADMIN and service:ops see everyone; a TRAINER
  // only their own active clients. Summary view, not paginated.
  rpc ListUsersWithoutPassword(ListUsersWithoutPasswordRequest) returns (ListUsersResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ADMIN = 1;
  TRAINER = 2;
  CLIENT = 3;
}

// One shape for every view, so older clients keep decoding it. id, name and role are always set.
// email is set in the contact, detail and self views; cpf and cref only in the detail and self
// views (cpf is also empty for a CLIENT who has none, cref for anyone but a TRAINER who set one).
// consent only in the self view.
message UserResponse {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string cpf = 4;
  string cref = 5;
  Role role = 6;
  ConsentState consent = 7;
}

// What the user has consented to. Empty strings mean "not given yet": the client then shows the
// first-access notice and calls RecordConsent.
message ConsentState {
  // The Terms of Use / Privacy Policy version accepted, and when (ISO-8601 instant).
  string accepted_terms_version = 1;
  string terms_accepted_at = 2;
  // The health-data notice version consented to, and when (ISO-8601 instant).
  string health_data_consent_version = 3;
  string health_data_consent_at = 4;
}

enum ConsentType {
  CONSENT_TYPE_UNSPECIFIED = 0;
  // The Terms of Use and Privacy Policy.
  TERMS = 1;
  // Processing of health-related data: loads, session logs and workout feedback.
  HEALTH_DATA = 2;
}

message RecordConsentRequest {
  // Required: CONSENT_TYPE_UNSPECIFIED is INVALID_ARGUMENT.
  ConsentType type = 1;
  // Required, at most 32 characters: the version of the text the user was shown (e.g. "2026-10-14").
  string version = 2;
}

message UserRequest {
  string name = 1;
  string email = 2;
  // Optional for a CLIENT (empty removes it), required for a TRAINER.
  string cpf = 3;
  string cref = 4;
  Role role = 5;
}

message UserCreateRequest {
  string name = 1;
  string email = 2;
  // Required by CreateUser. CreateClientForTrainer may leave it empty: the user is then created
  // without a password and sets one through a password setup token.
  string password = 3;
  // Optional for a CLIENT, required for a TRAINER (INVALID_ARGUMENT otherwise).
  string cpf = 4;
  string cref = 5;
  Role role = 6;
  // The Terms of Use / Privacy Policy version the user accepted at registration, at most 32
  // characters; stored with the server's time. Required by CreateUser (INVALID_ARGUMENT when
  // empty). CreateClientForTrainer never sets it: the client accepts for themself.
  string accepted_terms_version = 7;
}

message ListUsersRequest {
  // ROLE_UNSPECIFIED lists every role.
  Role role = 1;
  // Users per page. 0 means the default (100); anything above the maximum (100) is lowered to it;
  // a negative value is INVALID_ARGUMENT.
  int32 page_size = 2;
  // next_page_token from the previous page; empty for the first page. Opaque: pass it back as is.
  // A malformed token is INVALID_ARGUMENT.
  string page_token = 3;
}

message ListUsersWithoutPasswordRequest {
  // ROLE_UNSPECIFIED lists every role.
  Role role = 1;
}

message ListUsersResponse {
  repeated UserResponse users = 1;
  // Pass as page_token to get the next page. Empty on the last page. Always empty for
  // ListUsersWithoutPassword, which isn't paginated.
  string next_page_token = 2;
}

message GetUserRequest {
  int64 id = 1;
}

message UpdateUserRequest {
  int64 id = 1;
  UserRequest user = 2;
}

message DeleteUserRequest {
  int64 id = 1;
}

// Empty on purpose: an account is only ever deleted by its own user (the token's).
message DeleteAccountRequest {
}

// Empty on purpose: a user only ever exports their own data (the token's).
message ExportUserDataRequest {
}

message ExportUserDataResponse {
  // UTF-8 JSON. Top-level keys: formatVersion (bumped when a key is renamed or removed),
  // exportedAt, profile, consent, relationships, plans, workoutLogs, exercises. Timestamps are
  // ISO-8601 UTC, dates ISO-8601, decimals JSON numbers; a value never set is null.
  string json = 1;
}

message SetUserPasswordRequest {
  int64 id = 1;
  string password = 2;
}

message VerifyCredentialsRequest {
  string email = 1;
  string password = 2;
}

message CreatePasswordSetupTokenRequest {
  int64 user_id = 1;
}

message CreatePasswordSetupTokenResponse {
  // The raw token, URL-safe. Only its hash is stored, so this is the one time it can be read.
  string token = 1;
  // ISO-8601 instant after which the token is rejected.
  string expires_at = 2;
}

message SetPasswordWithTokenRequest {
  string token = 1;
  string password = 2;
}
